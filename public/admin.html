<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Firebox Admin</title><style>:root{--ink:#19161f;--muted:#77727f;--line:#ece9f1;--purple:#6e2ce6;--soft:#f2ebff}*{box-sizing:border-box}body{margin:0;background:#f8f7fb;color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{width:min(100%,760px);margin:0 auto;padding:44px 20px}.card{margin-top:20px;padding:24px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 12px 32px #2d1a580d}h1{margin:0;font-size:32px;letter-spacing:-.05em}p{color:var(--muted);font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 6px;color:#817b87;font-size:11px;font-weight:800}input{width:100%;padding:11px;border:1px solid #e7e1ee;border-radius:8px;font:inherit}.full{grid-column:1/-1}button{border:0;border-radius:8px;padding:11px 14px;color:#fff;background:var(--purple);font-weight:800;cursor:pointer}.server{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.server:last-child{border-bottom:0}.server strong{display:block}.server small{color:var(--muted)}.remove{color:#a83b50;background:#fff0f3}.notice{padding:12px;border-radius:8px;background:var(--soft);color:#5d3b9a;font-size:12px}</style></head><body><main class="wrap"><h1>Firebox server admin</h1><p>Add the remote Firebox deployments that visitors may choose from on the public pairing page.</p><div class="notice">Authentication is intentionally disabled for now. Anyone who knows <code>/admin</code> can add or remove servers.</div><section class="card"><h2>Add server</h2><form id="form" class="grid"><div><label for="name">Server name</label><input id="name" required placeholder="Server 2"/></div><div><label for="botId">Bot ID</label><input id="botId" required placeholder="server-2"/></div><div><label for="hubUrl">Webhook hub URL</label><input id="hubUrl" type="url" required placeholder="https://hub.example.com"/></div><div><label for="publicUrl">Public bot URL</label><input id="publicUrl" type="url" required placeholder="https://server-2.example.com"/></div><div class="full"><label for="botKey">Bot key</label><input id="botKey" type="password" required autocomplete="off"/></div><div class="full"><button type="submit">Add server</button></div></form></section><section class="card"><h2>Added servers</h2><div id="list">Loading…</div></section></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/bot/servers');$('#list').innerHTML=d.servers.length?d.servers.map(s=>`<div class="server"><div><strong>${esc(s.name)}</strong><small>${esc(s.publicUrl)}</small></div><button class="remove" data-id="${esc(s.id)}">Remove</button></div>`).join(''):'<p>No servers added yet.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await api('/api/bot/servers/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});load()})}$('#form').onsubmit=async e=>{e.preventDefault();try{await api('/api/bot/servers',{method:'POST',body:JSON.stringify({name:$('#name').value,hubUrl:$('#hubUrl').value,botId:$('#botId').value,botKey:$('#botKey').value,publicUrl:$('#publicUrl').value})});e.target.reset();load()}catch(err){alert(err.message)}};load();</script></body></html>
