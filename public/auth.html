<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Firebox — Account</title><style>:root{--bg:#080a0e;--panel:#11151b;--line:#2b313a;--ink:#f4f4f1;--muted:#9298a1;--gold:#f4c52b;--gold2:#ffda43;--red:#ff7180}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);background:radial-gradient(circle at 50% 0,#282615 0,#0b0d11 30%,var(--bg) 65%);font-family:Inter,system-ui,sans-serif}.card{width:min(100%,430px);padding:32px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#11151b,#0d1015);box-shadow:0 25px 75px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;color:#111;background:linear-gradient(145deg,#ffdc47,#d89b0a);font-size:25px}.brand strong{display:block;font-size:22px}.brand small{color:var(--muted)}h1{margin:0;font-size:25px;letter-spacing:-.04em}p{color:var(--muted);font-size:13px;line-height:1.55}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:24px 0 18px;padding:5px;border-radius:9px;background:#191d23}.tab{border:0;border-radius:7px;padding:10px;color:var(--muted);background:transparent;font:inherit;font-weight:800;cursor:pointer}.tab.active{color:#16120a;background:var(--gold)}label{display:block;margin:14px 0 7px;color:#b8bdc4;font-size:11px;font-weight:800}input{width:100%;padding:12px;border:1px solid #323943;border-radius:8px;color:var(--ink);background:#0d1116;font:inherit;outline:0}input:focus{border-color:#d2ae28;box-shadow:0 0 0 3px #f4c52b1c}.submit{width:100%;margin-top:21px;border:0;border-radius:8px;padding:13px;color:#18130a;background:linear-gradient(110deg,var(--gold2),#edb71e);font:inherit;font-weight:900;cursor:pointer}.error{min-height:18px;margin-top:12px;color:var(--red);font-size:12px}.hint{margin-top:18px;text-align:center;color:#777e88;font-size:11px}</style></head><body><main class="card"><div class="brand"><span class="mark">🤖</span><span><strong>FIREBOX</strong><small>WhatsApp Bot</small></span></div><h1 id="title">Welcome back</h1><p id="subtitle">Sign in to choose a server and connect your WhatsApp bot.</p><div class="tabs"><button class="tab active" id="login-tab" type="button">Sign in</button><button class="tab" id="register-tab" type="button">Create account</button></div><form id="form"><div id="name-field" hidden><label for="name">Name</label><input id="name" autocomplete="name"/></div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required/><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required/><button class="submit" id="submit" type="submit">Sign in</button><div class="error" id="error"></div></form><div class="hint">Your WhatsApp pairing session remains isolated to this browser.</div></main><script>const $=s=>document.querySelector(s);let mode="login";function setMode(next){mode=next;const register=mode==="register";$("#login-tab").classList.toggle("active",!register);$("#register-tab").classList.toggle("active",register);$("#name-field").hidden=!register;$("#name").required=register;$("#password").autocomplete=register?"new-password":"current-password";$("#title").textContent=register?"Create your account":"Welcome back";$("#subtitle").textContent=register?"Create an account to choose a server and connect your WhatsApp bot.":"Sign in to choose a server and connect your WhatsApp bot.";$("#submit").textContent=register?"Create account":"Sign in";$("#error").textContent=""}$("#login-tab").onclick=()=>setMode("login");$("#register-tab").onclick=()=>setMode("register");$("#form").onsubmit=async event=>{event.preventDefault();$("#error").textContent="";const body={email:$("#email").value,password:$("#password").value};if(mode==="register")body.name=$("#name").value;try{const response=await fetch(`/api/auth/${mode}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||"Request failed.");location.href="/"}catch(error){$("#error").textContent=error.message}};</script></body></html>
