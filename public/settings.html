<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Firebox — Settings</title><style>:root{--bg:#080a0e;--panel:#11151b;--line:#2a3039;--ink:#f4f4f1;--muted:#9298a1;--gold:#f4c52b;--red:#ff7180}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 78% 0,#262515 0,#0b0d11 30%,var(--bg) 65%);font-family:Inter,system-ui,sans-serif}.wrap{width:min(100%,900px);margin:0 auto;padding:30px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;color:#111;background:linear-gradient(145deg,#ffdc47,#d89b0a);font-size:24px}.brand strong{display:block;font-size:21px}.brand small{color:var(--muted)}button,a{border:0;border-radius:8px;padding:11px 14px;color:#18130a;background:var(--gold);font:inherit;font-weight:900;text-decoration:none;cursor:pointer}.ghost{color:#d8dce0;background:#1b2027}.back{margin-top:30px;color:var(--muted);background:transparent;padding:0}h1{margin:25px 0 7px;font-size:32px;letter-spacing:-.06em}.sub{margin:0;color:var(--muted);font-size:13px}.card{margin-top:22px;padding:23px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#12171d,#0e1116);box-shadow:0 18px 45px #0005}h2{margin:0 0 18px;font-size:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #252b33}.row:last-child{border-bottom:0}.label{color:var(--muted);font-size:12px}.value{font-weight:800;text-align:right;overflow-wrap:anywhere}.danger{border-color:#52212b}.danger h2{color:#ff9eaa}.danger p{color:var(--muted);font-size:13px;line-height:1.5}@media(max-width:560px){.wrap{padding:22px 14px}.top{align-items:flex-start;flex-direction:column}.row{align-items:flex-start;flex-direction:column;gap:7px}.value{text-align:left}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="mark">🤖</span><span><strong>FIREBOX</strong><small>Settings</small></span></div><div><button class="ghost" id="logout">Log out</button></div></header><a class="back" href="/">← Back to workspace</a><h1>Settings</h1><p class="sub">Manage your account and current Firebox session.</p><section class="card"><h2>Account</h2><div class="row"><span class="label">Name</span><span class="value" id="name">Loading…</span></div><div class="row"><span class="label">Email</span><span class="value" id="email">Loading…</span></div></section><section class="card"><h2>Session</h2><div class="row"><span class="label">Pairing isolation</span><span class="value">Private to this browser</span></div><div class="row"><span class="label">Credentials</span><span class="value">Not shown in Settings</span></div></section><section class="card danger"><h2>Sign out</h2><p>Sign out of this Firebox account on the current browser.</p><button id="logout-bottom">Log out</button></section></main><script>async function api(url,opt={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Request failed');return data}async function load(){try{const data=await api('/api/auth/me');if(!data.user)return location.href='/auth';document.querySelector('#name').textContent=data.user.name;document.querySelector('#email').textContent=data.user.email}catch(error){location.href='/auth'}}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/auth'}document.querySelector('#logout').onclick=logout;document.querySelector('#logout-bottom').onclick=logout;load();</script></body></html>
