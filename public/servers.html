<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Firebox</title>
  <style>
    :root { --ink:#19161f; --muted:#77727f; --line:#ece9f1; --bg:#ffffff; --lavender:#f4efff; --purple:#6e2ce6; --purple-dark:#5621c1; --purple-soft:#ede4ff; --green:#1a985b; --green-soft:#eaf9f1; --red:#c7465a; --red-soft:#fff0f3; --blue:#466ec1; --blue-soft:#edf2ff; --shadow:0 8px 26px rgba(35,22,65,.055); }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .app { min-height:100vh; display:grid; grid-template-columns:272px minmax(0,1fr); } .sidebar { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:25px 16px 20px; border-right:1px solid var(--line); background:#fff; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 8px; color:var(--ink); text-decoration:none; } .brand-mark { width:37px; height:37px; display:grid; place-items:center; border-radius:12px; color:#fff; font-weight:900; font-size:20px; background:linear-gradient(140deg,#a882fb,#5e21d5); box-shadow:0 8px 18px rgba(110,44,230,.22); } .brand-title { font-size:20px; font-weight:850; letter-spacing:-.04em; } .brand-subtitle { margin-top:1px; color:var(--muted); font-size:12px; font-weight:600; }
    .side-heading { margin:47px 9px 11px; color:#8e8897; font-size:11px; font-weight:850; letter-spacing:.06em; text-transform:uppercase; } .server-nav { display:grid; gap:6px; } .server-item { width:100%; display:flex; align-items:center; gap:12px; border:0; border-left:3px solid transparent; border-radius:9px; padding:12px 11px; color:#514b58; background:transparent; font:inherit; font-size:14px; font-weight:700; text-align:left; cursor:pointer; transition:background .16s,color .16s; } .server-item:hover { background:#f8f6fb; } .server-item.active { border-left-color:var(--purple); color:var(--purple-dark); background:linear-gradient(90deg,#f2eaff,#fbf9ff); } .server-icon { display:grid; place-items:center; width:20px; color:inherit; font-size:17px; } .server-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .add-server { display:flex; align-items:center; gap:8px; width:calc(100% - 16px); margin:18px 8px 0; padding:10px 12px; border:1px dashed #cfc3e9; border-radius:9px; color:#6343a8; background:#fcfaff; font:inherit; font-size:12px; font-weight:800; cursor:pointer; } .add-server:hover { border-color:var(--purple); color:var(--purple); background:#f7f1ff; }
    .account { display:flex; align-items:center; gap:10px; margin-top:auto; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; } .avatar { display:grid; place-items:center; flex:0 0 37px; width:37px; height:37px; border-radius:50%; color:#6131b9; background:var(--lavender); font-size:13px; font-weight:900; } .account-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:800; } .account-email { overflow:hidden; margin-top:2px; color:var(--muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap; } .account-button { margin-left:auto; border:0; color:#746b7b; background:transparent; font-size:16px; cursor:pointer; }
    .main { min-width:0; } .topbar { height:73px; display:flex; align-items:center; justify-content:flex-end; gap:22px; padding:0 38px; border-bottom:1px solid var(--line); } .bot-controls { color:#6f55a3; text-decoration:none; font-size:12px; font-weight:800; } .bot-controls:hover { color:var(--purple); } .bell { display:grid; place-items:center; width:34px; height:34px; border:1px solid #f0edf4; border-radius:50%; color:#5f5966; background:#fff; font-size:16px; } .profile { display:flex; align-items:center; gap:9px; } .profile-name { max-width:145px; overflow:hidden; font-size:13px; font-weight:800; text-overflow:ellipsis; white-space:nowrap; } .chevron { color:#827b8a; font-size:14px; }
    .content { max-width:1040px; margin:0 auto; padding:27px 40px 36px; } .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; } .page-head h1 { margin:0; font-size:29px; letter-spacing:-.055em; line-height:1.1; } .page-head p { margin:7px 0 0; color:var(--muted); font-size:14px; } .status-pill { display:inline-flex; align-items:center; gap:8px; margin-top:13px; padding:8px 13px; border-radius:999px; color:#716b77; background:#f6f5f7; font-size:12px; font-weight:800; white-space:nowrap; } .status-pill:before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; } .status-pill.online { color:var(--green); background:var(--green-soft); } .status-pill.offline { color:#77717b; background:#f4f3f5; } .status-pill.maintenance { color:var(--blue); background:var(--blue-soft); }
    .workspace { position:relative; min-height:634px; margin-top:23px; overflow:hidden; border:1px solid #efedf2; border-radius:13px; background:#fff; box-shadow:var(--shadow); } .workspace:before { content:""; position:absolute; width:290px; height:290px; top:-160px; left:50%; border-radius:50%; background:radial-gradient(circle,rgba(150,106,241,.09),transparent 66%); transform:translateX(-50%); pointer-events:none; }
    .connection { position:relative; z-index:1; display:grid; justify-items:center; padding:52px 25px 29px; text-align:center; } .connection-icon { display:grid; place-items:center; width:71px; height:71px; border-radius:50%; color:var(--purple); background:radial-gradient(circle at 35% 25%,#fbf9ff,#e8ddff); box-shadow:0 10px 27px rgba(110,44,230,.13); font-size:31px; } .connection h2 { margin:16px 0 7px; font-size:20px; letter-spacing:-.035em; } .connection > p { max-width:380px; margin:0; color:var(--muted); font-size:13px; line-height:1.55; }
    .endpoint-card { width:min(100%,366px); margin-top:21px; padding:17px; border:1px solid #ebe7f2; border-radius:10px; background:#fff; box-shadow:0 3px 12px rgba(37,22,63,.03); } .endpoint-label { color:#817b87; font-size:11px; font-weight:800; } .endpoint-value { margin:8px 0 3px; overflow-wrap:anywhere; color:var(--purple-dark); font-size:22px; font-weight:900; letter-spacing:-.035em; } .endpoint-sub { color:#827b87; font-size:11px; } .primary { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:49px; width:min(100%,366px); margin-top:11px; border:0; border-radius:8px; color:#fff; background:linear-gradient(110deg,#7130e9,#5a1ed2); box-shadow:0 9px 18px rgba(100,35,221,.23); font:inherit; font-size:14px; font-weight:850; text-decoration:none; cursor:pointer; transition:transform .15s ease,box-shadow .15s ease; } .primary:hover { box-shadow:0 12px 24px rgba(100,35,221,.3); } .primary:active { transform:scale(.98); }
    .separator { height:1px; margin:0 20px; background:#efedf1; } .how { display:grid; grid-template-columns:1fr auto; gap:28px; align-items:start; padding:26px 25px 28px; } .how h3 { margin:0 0 16px; font-size:14px; letter-spacing:-.02em; } .steps { display:grid; gap:10px; } .step { display:flex; align-items:flex-start; gap:10px; color:#57515d; font-size:12px; line-height:1.45; } .step-number { display:grid; place-items:center; flex:0 0 20px; width:20px; height:20px; border-radius:50%; color:#7851c0; background:#f5f0ff; font-size:10px; font-weight:900; } .meta { display:grid; grid-template-columns:repeat(2,minmax(120px,1fr)); gap:10px; min-width:280px; } .meta-card { padding:11px; border:1px solid #efecf2; border-radius:8px; background:#fdfcff; } .meta-card span { display:block; color:#938c98; font-size:9px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; } .meta-card strong { display:block; margin-top:5px; overflow-wrap:anywhere; color:#3b3541; font-size:12px; }
    .record-actions { position:absolute; right:20px; bottom:18px; display:flex; gap:8px; } .secondary { border:1px solid #e4ddec; border-radius:7px; padding:8px 10px; color:#6946a9; background:#fff; font:inherit; font-size:11px; font-weight:850; cursor:pointer; } .secondary:hover { border-color:#bba5e9; background:#fcfaff; } .danger { border:1px solid #f0d7dc; color:var(--red); }
    .empty { display:grid; min-height:520px; place-items:center; padding:35px; text-align:center; } .empty-card { max-width:420px; } .empty-icon { display:grid; place-items:center; width:72px; height:72px; margin:0 auto 17px; border-radius:50%; color:var(--purple); background:#f3edff; font-size:28px; } .empty h2 { margin:0; font-size:21px; letter-spacing:-.04em; } .empty p { margin:9px auto 0; color:var(--muted); font-size:13px; line-height:1.55; }
    .modal { position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:18px; background:rgba(28,22,41,.28); backdrop-filter:blur(3px); } .modal.open { display:grid; } .dialog { width:min(100%,620px); max-height:92vh; overflow:auto; border-radius:14px; background:#fff; box-shadow:0 22px 60px rgba(24,14,45,.2); } .dialog-head { display:flex; align-items:center; justify-content:space-between; padding:19px 21px; border-bottom:1px solid var(--line); } .dialog-head h2 { margin:0; font-size:18px; letter-spacing:-.035em; } .close { border:0; color:#746d7c; background:transparent; font-size:23px; cursor:pointer; } .form { padding:21px; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; } .field { display:grid; gap:7px; } .field.full { grid-column:1/-1; } label { color:#67616d; font-size:10px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; } input,select,textarea { width:100%; border:1px solid #e7e2eb; border-radius:8px; padding:10px 11px; color:var(--ink); background:#fff; font:inherit; font-size:13px; outline:0; } input:focus,select:focus,textarea:focus { border-color:#9a77e7; box-shadow:0 0 0 3px rgba(110,44,230,.09); } textarea { min-height:95px; resize:vertical; } .form-note { grid-column:1/-1; padding:10px 11px; border-radius:8px; color:#786d5b; background:#fffaf1; font-size:11px; line-height:1.45; } .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:20px; } .save { border:0; border-radius:8px; padding:10px 13px; color:#fff; background:var(--purple); font:inherit; font-size:12px; font-weight:850; cursor:pointer; }
    .toast { position:fixed; right:23px; bottom:23px; z-index:30; display:none; padding:12px 14px; border-radius:9px; color:#fff; background:#29232f; box-shadow:0 15px 30px rgba(0,0,0,.16); font-size:12px; } .toast.show { display:block; }
    @media(max-width:820px) { .app { grid-template-columns:1fr; } .sidebar { position:relative; height:auto; padding:17px; border-right:0; border-bottom:1px solid var(--line); } .brand { padding:0; } .side-heading { margin-top:22px; } .server-nav { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); } .server-item { border-left:0; border-bottom:3px solid transparent; } .server-item.active { border-left:0; border-bottom-color:var(--purple); } .account { display:none; } .topbar { height:58px; padding:0 18px; } .content { padding:25px 16px; } .how { grid-template-columns:1fr; } .meta { min-width:0; } }
    @media(max-width:520px) { .page-head { align-items:flex-start; flex-direction:column; } .workspace { min-height:0; } .connection { padding:42px 18px 25px; } .how { padding:23px 18px 70px; } .record-actions { left:18px; right:auto; bottom:17px; } .form-grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } .profile-name,.chevron { display:none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="/dashboard"><span class="brand-mark">🤖</span><span><span class="brand-title">Firebox</span><span class="brand-subtitle">WhatsApp Bots</span></span></a>
      <div class="side-heading">Servers</div><div class="server-nav" id="server-nav"></div><button class="add-server" id="add-server">＋ Add server</button>
      <div class="account"><span class="avatar" id="user-initials">FB</span><span style="min-width:0;flex:1"><span class="account-name" id="user-name">Loading…</span><span class="account-email" id="user-email"></span></span><button class="account-button" id="logout" title="Sign out">⌄</button></div>
    </aside>
    <main class="main"><header class="topbar"><a class="bot-controls" href="/bot-dashboard">Bot controls</a><span class="bell" aria-label="Notifications">♧</span><div class="profile"><span class="avatar" id="profile-initials">FB</span><span class="profile-name" id="profile-name">Firebox user</span><span class="chevron">⌄</span></div></header>
      <section class="content"><div class="page-head"><div><h1 id="server-title">Your server</h1><p id="server-subtitle">Select a server to review its connection workspace.</p></div><span class="status-pill offline" id="status-pill">Not connected</span></div>
        <section class="workspace" id="workspace"></section>
      </section>
    </main>
  </div>
  <div class="modal" id="form-modal"><div class="dialog"><div class="dialog-head"><h2 id="form-title">Add a server</h2><button class="close" data-close="form-modal" aria-label="Close">×</button></div><form class="form" id="server-form"><div class="form-grid"><div class="field"><label for="instanceName">Instance name</label><input id="instanceName" maxlength="160" required placeholder="e.g. Server 1" /></div><div class="field"><label for="provider">Hosting provider</label><input id="provider" maxlength="120" required placeholder="e.g. VPS, Railway, Render" /></div><div class="field full"><label for="endpoint">URL or IP address</label><input id="endpoint" maxlength="500" required placeholder="e.g. https://bot.example.com" /></div><div class="field"><label for="region">Region</label><input id="region" maxlength="120" required placeholder="e.g. Nairobi, Kenya" /></div><div class="field"><label for="environment">Environment</label><select id="environment"><option value="production">Production</option><option value="staging">Staging</option><option value="development">Development</option><option value="other">Other</option></select></div><div class="field"><label for="status">Status</label><select id="status"><option value="offline">Not connected</option><option value="online">Online</option><option value="maintenance">Maintenance</option></select></div><div class="field full"><label for="notes">Operational notes</label><textarea id="notes" maxlength="4000" placeholder="Connection context, planned maintenance, or handover notes."></textarea></div><div class="form-note">Keep passwords, pairing codes, tokens, SSH keys, and other credentials outside this dashboard.</div></div><div class="form-actions"><button class="secondary" type="button" data-close="form-modal">Cancel</button><button class="save" type="submit">Save server</button></div></form></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const $ = selector => document.querySelector(selector); let servers=[]; let selectedId=null; let editingId=null;
    const esc = value => String(value ?? "").replace(/[&<>'"]/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[character]));
    const initials = name => String(name || "FB").split(/\s+/).slice(0,2).map(part => part[0]).join("").toUpperCase();
    const formatDate = value => value ? new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",year:"numeric"}).format(new Date(value)) : "—";
    async function api(url,options={}) { const response=await fetch(url,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options}); const data=await response.json().catch(()=>({})); if(!response.ok) throw new Error(data.error||"Request failed."); return data; }
    function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),3200);}
    function openModal(id){$("#"+id).classList.add("open");} function closeModal(id){$("#"+id).classList.remove("open");}
    function statusLabel(status){return status === "online" ? "Connected" : status === "maintenance" ? "Maintenance" : "Not connected";}
    function renderNavigation(){const nav=$("#server-nav");if(!servers.length){nav.innerHTML='<div style="padding:10px 11px;color:#918b97;font-size:12px;line-height:1.45">No servers yet</div>';return;}nav.innerHTML=servers.map(server=>`<button class="server-item ${server.id===selectedId?"active":""}" data-id="${esc(server.id)}"><span class="server-icon">▦</span><span class="server-label">${esc(server.instanceName)}</span></button>`).join("");nav.querySelectorAll(".server-item").forEach(button=>button.addEventListener("click",()=>{selectedId=button.dataset.id;render();}));}
    function renderEmpty(){ $("#server-title").textContent="Your Firebox servers"; $("#server-subtitle").textContent="Add the first server record to create your connection workspace."; $("#status-pill").className="status-pill offline"; $("#status-pill").textContent="No servers"; $("#workspace").innerHTML='<div class="empty"><div class="empty-card"><div class="empty-icon">⌁</div><h2>Start with your first server</h2><p>Keep each Firebox bot server organized in one private workspace. Connection credentials are not stored here.</p><button class="primary" onclick="openCreate()">＋ Add server</button></div></div>'; }
    function renderWorkspace(server){const status=statusLabel(server.status); $("#server-title").textContent=server.instanceName; $("#server-subtitle").textContent="Connect and manage this WhatsApp bot workspace."; const pill=$("#status-pill");pill.className=`status-pill ${server.status}`;pill.textContent=status; $("#workspace").innerHTML=`<section class="connection"><div class="connection-icon">⌁</div><h2>Connect to this bot</h2><p>Open the Firebox pairing flow when you are ready to link the WhatsApp account for <strong>${esc(server.instanceName)}</strong>.</p><div class="endpoint-card"><div class="endpoint-label">Server endpoint</div><div class="endpoint-value">${esc(server.endpoint)}</div><div class="endpoint-sub">${esc(server.provider)} · ${esc(server.region)}</div></div><a class="primary" href="/connect">⟳ Open connection flow</a></section><div class="separator"></div><section class="how"><div><h3>How to connect</h3><div class="steps"><div class="step"><span class="step-number">1</span><span>Open WhatsApp on your phone.</span></div><div class="step"><span class="step-number">2</span><span>Go to Linked Devices.</span></div><div class="step"><span class="step-number">3</span><span>Choose Link a Device and open the Firebox pairing flow.</span></div><div class="step"><span class="step-number">4</span><span>Complete linking without saving credentials in this dashboard.</span></div></div></div><div class="meta"><div class="meta-card"><span>Environment</span><strong>${esc(server.environment)}</strong></div><div class="meta-card"><span>Updated</span><strong>${formatDate(server.updatedAt)}</strong></div><div class="meta-card"><span>Notes</span><strong>${server.notes?esc(server.notes):"No notes"}</strong></div><div class="meta-card"><span>Status</span><strong>${esc(status)}</strong></div></div></section><div class="record-actions"><button class="secondary" id="change-status">Change status</button><button class="secondary" id="edit-server">Edit server</button><button class="secondary danger" id="remove-server">Remove</button></div>`; $("#change-status").onclick=()=>cycleStatus(server); $("#edit-server").onclick=()=>openEdit(server); $("#remove-server").onclick=()=>removeServer(server);}
    function render(){if(!servers.length){selectedId=null;renderNavigation();renderEmpty();return;}if(!servers.some(server=>server.id===selectedId))selectedId=servers[0].id;renderNavigation();renderWorkspace(servers.find(server=>server.id===selectedId));}
    function openCreate(){editingId=null;$("#form-title").textContent="Add a server";$("#server-form").reset();$("#environment").value="production";$("#status").value="offline";openModal("form-modal");} window.openCreate=openCreate;
    function openEdit(server){editingId=server.id;$("#form-title").textContent="Edit server";["instanceName","provider","endpoint","region","environment","status","notes"].forEach(key=>$("#"+key).value=server[key]||"");openModal("form-modal");}
    async function cycleStatus(server){const next={offline:"online",online:"maintenance",maintenance:"offline"}[server.status];try{await api("/api/dashboard/servers/"+encodeURIComponent(server.id)+"/status",{method:"PATCH",body:JSON.stringify({status:next})});await load();toast(`Status changed to ${statusLabel(next)}.`);}catch(error){toast(error.message);}}
    async function removeServer(server){if(!confirm(`Remove ${server.instanceName}? This deletes only this registry record.`))return;try{await api("/api/dashboard/servers/"+encodeURIComponent(server.id),{method:"DELETE"});selectedId=null;await load();toast("Server record removed.");}catch(error){toast(error.message);}}
    $("#add-server").addEventListener("click",openCreate);$("#server-form").addEventListener("submit",async event=>{event.preventDefault();const data={};["instanceName","provider","endpoint","region","environment","status","notes"].forEach(key=>data[key]=$("#"+key).value.trim());try{const url=editingId?"/api/dashboard/servers/"+encodeURIComponent(editingId):"/api/dashboard/servers";const result=await api(url,{method:editingId?"PUT":"POST",body:JSON.stringify(data)});selectedId=result.server.id;closeModal("form-modal");await load();toast(editingId?"Server updated.":"Server added.");}catch(error){toast(error.message);}});document.querySelectorAll("[data-close]").forEach(button=>button.addEventListener("click",()=>closeModal(button.dataset.close)));$("#form-modal").addEventListener("click",event=>{if(event.target===$("#form-modal"))closeModal("form-modal");});$("#logout").addEventListener("click",async()=>{try{await api("/api/dashboard/auth/logout",{method:"POST"});}finally{location.href="/login";}});
    async function load(){try{const [auth,records]=await Promise.all([api("/api/dashboard/auth/me"),api("/api/dashboard/servers")]);if(!auth.user){location.href="/login";return;}const label=auth.user.name||auth.user.email;$("#user-name").textContent=label;$("#user-email").textContent=auth.user.email;$("#profile-name").textContent=label;$("#user-initials").textContent=initials(label);$("#profile-initials").textContent=initials(label);servers=records.servers||[];render();}catch(error){location.href="/login";}} load();
  </script>
</body>
</html>
