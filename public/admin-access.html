<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firebox // Admin Access</title><style>:root{--bg:#080b12;--panel:#0e1420;--line:#26364b;--cyan:#52f7ff;--pink:#ff4fd8;--text:#eaf7ff;--muted:#8292a8;--danger:#ff789f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:radial-gradient(circle at 50% 0,#142238 0,transparent 45%),var(--bg)}.panel{width:min(440px,100%);padding:32px;border:1px solid var(--line);border-left:3px solid var(--pink);background:#0e1420e8;box-shadow:12px 12px 0 #122235}.eyebrow{color:var(--pink);font-size:11px;letter-spacing:.2em}.mark{display:block;margin:18px 0 8px;color:var(--cyan);font-weight:900;letter-spacing:.16em}.sub{color:var(--muted);line-height:1.6}label{display:block;margin:20px 0 8px;color:var(--cyan);font-size:11px;letter-spacing:.08em}input{width:100%;padding:14px;border:1px solid #34506a;outline:0;color:var(--text);background:#080d15;font:inherit}input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #52f7ff22}button{width:100%;margin-top:18px;padding:14px;border:1px solid var(--cyan);color:#041016;background:var(--cyan);font:900 12px ui-monospace;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{min-height:18px;margin-top:14px;color:var(--danger);font-size:12px}.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:11px;text-decoration:none}.back:hover{color:var(--cyan)}</style></head><body><main class="panel"><div class="eyebrow">[ FIREBOX // ADMIN NODE ]</div><strong class="mark">ADMINISTRATOR ACCESS</strong><p class="sub">Sign in with the configured administrator account to open the Firebox user and token control center.</p><form id="form"><label for="email">ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" required><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">OPEN ADMIN CONSOLE //→</button><div id="error" class="error" aria-live="polite"></div></form><a class="back" href="/token">← BACK TO FIREBOX TOKEN</a></main><script>const $=s=>document.querySelector(s);$('#form').onsubmit=async event=>{event.preventDefault();const button=$('#submit');button.disabled=true;button.textContent='AUTHENTICATING //…';$('#error').textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Administrator authentication failed.');location.href='/admin'}catch(error){$('#error').textContent=error.message;button.disabled=false;button.textContent='OPEN ADMIN CONSOLE //→'}};</script></body></html>
